<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CuidaVoz — Panel</title>
  <style>
    :root {
      --bg: #0f1c1a;
      --panel: #17302c;
      --text: #e8f2ef;
      --muted: #9bb5ae;
      --accent: #2db88a;
      --warn: #e0a106;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1d4a40 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: -0.03em; margin: 0 0 0.35rem; }
    h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-bottom: 1.25rem;
    }
    .stat, .box {
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid #2a4a43;
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }
    .stat .label { color: var(--muted); font-size: 0.85rem; }
    .stat .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.25rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin: 1rem 0 1.5rem; }
    button, .btn {
      border: 0; border-radius: 999px; padding: 0.7rem 1.1rem;
      font-weight: 600; cursor: pointer; background: var(--accent); color: #06241a;
    }
    button.secondary { background: #2a4450; color: var(--text); }
    button.warn { background: var(--warn); color: #1d1400; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.55rem 0 0.25rem; }
    input {
      width: 100%; border-radius: 10px; border: 1px solid #2f5249; background: #0b1513;
      color: var(--text); padding: 0.65rem 0.75rem;
    }
    .form-grid { display: grid; gap: 0.35rem 1rem; grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
    pre {
      white-space: pre-wrap; word-break: break-word; background: #0b1513;
      border-radius: 12px; padding: 1rem; border: 1px solid #27443d; color: #cfe6df; min-height: 120px;
    }
    .badge {
      display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px;
      font-size: 0.75rem; background: #21463d; color: var(--accent);
    }
    .alert {
      margin-top: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px;
      background: #3a221f; border: 1px solid #6d3a34; color: #ffd4ce; display: none;
    }
    .alert.show { display: block; }
    .ok {
      margin-top: 0.75rem; padding: 0.85rem 1rem; border-radius: 12px;
      background: #1a3a30; border: 1px solid #2db88a; color: #b6f0d6; display: none;
    }
    .ok.show { display: block; }
    ul.meds { margin: 0.5rem 0 0; padding-left: 1.1rem; color: #cfe6df; }
    .stack { display: grid; gap: 1rem; margin-bottom: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">CuidaVoz · demo funcional</span>
    <h1>Panel del hogar</h1>
    <p class="sub">Configura paciente y Telegram del cuidador, dispara el flujo de adherencia y escala si no hay respuesta.</p>

    <div class="grid">
      <div class="stat"><div class="label">Tomadas</div><div class="value" id="taken">—</div></div>
      <div class="stat"><div class="label">Esperadas</div><div class="value" id="expected">—</div></div>
      <div class="stat"><div class="label">Pendientes</div><div class="value" id="pending">—</div></div>
      <div class="stat"><div class="label">Paciente</div><div class="value" id="patient" style="font-size:1.1rem">—</div></div>
    </div>

    <div class="stack">
      <div class="box">
        <h2>1. Configurar hogar</h2>
        <div class="form-grid">
          <div>
            <label>Nombre del paciente</label>
            <input id="nombre" placeholder="Juan" />
          </div>
          <div>
            <label>Telegram chat_id del cuidador</label>
            <input id="telegram" placeholder="123456789" />
          </div>
          <div>
            <label>Medicamento (opcional)</label>
            <input id="medNombre" placeholder="Amoxicilina" />
          </div>
          <div>
            <label>Dosis + hora</label>
            <input id="medMeta" placeholder="500 mg @ 08:00" />
          </div>
          <div>
            <label>Días de tratamiento (ej. 5)</label>
            <input id="medDias" type="number" min="1" placeholder="5" value="5" />
          </div>
        </div>
        <div class="actions">
          <button onclick="saveHousehold()">Guardar configuración</button>
          <button class="secondary" onclick="loadHousehold()">Cargar</button>
        </div>
        <div id="medsBox"></div>
      </div>

      <div class="box">
        <h2>2. Demostrar el problema resuelto</h2>
        <div class="actions">
          <button onclick="runFullFlow()">Demo completa (recordatorio → Telegram → confirmado)</button>
          <button class="secondary" onclick="triggerReminder()">Solo recordatorio</button>
          <button class="warn" onclick="simulateNoResponse()">Solo escalado Telegram</button>
          <button class="secondary" onclick="confirmTaken()">Confirmar “ya lo tomé”</button>
          <button class="secondary" onclick="refresh()">Actualizar</button>
        </div>
        <div class="alert" id="wa"></div>
        <div class="ok" id="ok"></div>
      </div>
    </div>

    <div class="box"><pre id="out">Listo.</pre></div>
  </main>
  <script>
    const userId = "demo-user";
    const out = document.getElementById("out");
    const wa = document.getElementById("wa");
    const ok = document.getElementById("ok");

    async function loadHousehold() {
      const res = await fetch(`/demo/household/${userId}`);
      const data = await res.json();
      document.getElementById("nombre").value = data.user?.nombre || "";
      document.getElementById("telegram").value = data.user?.cuidador_telegram || "";
      document.getElementById("patient").textContent = data.user?.nombre || "—";
      const meds = data.medications || [];
      document.getElementById("medsBox").innerHTML =
        "<ul class='meds'>" + meds.map(m => {
          const curso = m.dias_tratamiento
            ? ` · curso ${m.dias_tratamiento} días (${m.fecha_inicio} → ${m.fecha_fin})`
            : " · continuo";
          return `<li>${m.nombre} ${m.dosis} · ${(m.horarios||[]).join(", ")}${curso}</li>`;
        }).join("") + "</ul>";
      out.textContent = JSON.stringify(data, null, 2);
    }

    async function saveHousehold() {
      const nombre = document.getElementById("nombre").value.trim();
      const telegram = document.getElementById("telegram").value.trim();
      const res = await fetch("/demo/setup-household", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, nombre, cuidador_telegram: telegram })
      });
      const data = await res.json();
      const medNombre = document.getElementById("medNombre").value.trim();
      const medMeta = document.getElementById("medMeta").value.trim();
      if (medNombre) {
        let dosis = "";
        let time = "08:00";
        if (medMeta.includes("@")) {
          const [d, t] = medMeta.split("@").map(s => s.trim());
          dosis = d; time = t || "08:00";
        } else if (medMeta) {
          dosis = medMeta;
        }
        await fetch("/demo/add-medication", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            nombre: medNombre,
            dosis,
            time,
            dias_tratamiento: Number(document.getElementById("medDias").value || 0) || null
          })
        });
      }
      ok.textContent = data.message || "Configuración guardada";
      ok.classList.add("show");
      out.textContent = JSON.stringify(data, null, 2);
      await loadHousehold();
      await refresh();
    }

    async function refresh() {
      const res = await fetch(`/demo/adherence/${userId}`);
      const data = await res.json();
      const d = data.data || {};
      document.getElementById("taken").textContent = d.taken ?? 0;
      document.getElementById("expected").textContent = d.expected ?? 0;
      document.getElementById("pending").textContent = d.pending ?? 0;
      out.textContent = JSON.stringify(data, null, 2);
    }

    async function triggerReminder() {
      wa.classList.remove("show"); ok.classList.remove("show");
      const res = await fetch(`/demo/trigger-reminder?user_id=${userId}`, { method: "POST" });
      out.textContent = JSON.stringify(await res.json(), null, 2);
      await refresh();
    }

    async function simulateNoResponse() {
      ok.classList.remove("show");
      const res = await fetch(`/demo/simulate-no-response?user_id=${userId}`, { method: "POST" });
      const data = await res.json();
      out.textContent = JSON.stringify(data, null, 2);
      if (data.telegram_preview) {
        wa.textContent = "Telegram al cuidador: " + data.telegram_preview;
        wa.classList.add("show");
      }
      await refresh();
    }

    async function confirmTaken() {
      wa.classList.remove("show");
      const res = await fetch(`/demo/confirm-taken?user_id=${userId}`, { method: "POST" });
      const data = await res.json();
      out.textContent = JSON.stringify(data, null, 2);
      ok.textContent = "Dosis confirmada. Adherencia actualizada.";
      ok.classList.add("show");
      await refresh();
    }

    async function runFullFlow() {
      wa.classList.remove("show"); ok.classList.remove("show");
      const res = await fetch(`/demo/run-full-flow?user_id=${userId}`, { method: "POST" });
      const data = await res.json();
      out.textContent = JSON.stringify(data, null, 2);
      const preview = data.steps?.["2_escalation_telegram"]?.telegram_preview;
      if (preview) {
        wa.textContent = "Telegram al cuidador: " + preview;
        wa.classList.add("show");
      }
      ok.textContent = data.summary || "Flujo completo ejecutado";
      ok.classList.add("show");
      await loadHousehold();
      await refresh();
    }

    loadHousehold();
    refresh();
  </script>
</body>
</html>
